<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>iClicker Poll Notifier</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <img src="icons/icon-48.png" alt="" width="36" height="36">
        <div>
          <h1>iClicker Notifier</h1>
          <p id="site-status" class="site-status">Checking this tab…</p>
        </div>
      </header>

      <section class="setting-row">
        <div>
          <h2>Poll URL alerts</h2>
          <p>Notify when iClicker opens a new URL</p>
        </div>
        <label class="switch" aria-label="Enable poll URL alerts">
          <input id="alerts-enabled" type="checkbox">
          <span class="switch-track"></span>
        </label>
      </section>

      <section class="setting-row sound-row">
        <div>
          <h2>Sound</h2>
          <p>Play a short chime with each alert</p>
        </div>
        <label class="switch" aria-label="Enable alert sound">
          <input id="sound-enabled" type="checkbox">
          <span class="switch-track"></span>
        </label>
      </section>

      <section id="volume-section" class="volume-section">
        <label for="sound-volume">Chime volume <span id="volume-value">80%</span></label>
        <input id="sound-volume" type="range" min="0.1" max="1" step="0.1" value="0.8">
        <button id="test-sound" class="secondary-button" type="button">Test sound</button>
      </section>

      <p id="feedback" class="feedback" aria-live="polite"></p>
      <footer>Only the page URL is checked. Page content is not read.</footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
